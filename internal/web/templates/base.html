{{define "head"}}<!doctype html>
<html lang="en"><head>
{{if .NeedsViewer}}<script type="module" src="/assets/model-viewer.min.js"></script>{{end}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mise</title>
<style>
/* ---- tokens ---------------------------------------------------------------
   The single source of truth for colour, space, radius and type. Nothing below
   may contain a raw hex or a bare length for these; change the value here and
   the whole app follows. The enforced pairings are checked by ui_test.go
   (TestTokenContrast / TestNoRawHexOutsideTokens).

   The register is "workbench": cool graphite surfaces, orange for actions and blue for links, rounded
   cards. Dark by intent — this is a tool you look at with the lights on in a
   shed, not a document. */
:root{
  /* surfaces, darkest first */
  --bg:#13161a;
  --surface:#1b1f25;      /* cards, inputs, wells */
  --surface-2:#252b33;    /* raised chips: tags, step numbers, quiet buttons */
  --paper:#ffffff;        /* light surface for embedded documents */
  --line:#303740;         /* borders, dividers */
  --line-strong:#434c58;  /* emphasised borders */
  /* text, brightest first */
  --fg:#eef1f5;
  --dim:#b6bfca;          /* secondary text: 8.79:1 on --bg */
  --faint:#8d98a6;      /* placeholders and de-emphasised meta: 5.44:1 on --bg,
                           and still 4.43:1 on --surface-2 (the old #847766 was
                           4.09:1 — below AA, and used for table headers) */
  --on-acc:#1a0b00;       /* text on an accent background */
  /* semantic */
  --acc:#ff6700;          /* primary action, active nav, step numbers */
  --acc-hover:#ff8533;
  --link:#0098ff;         /* links and focus rings */
  --link-hover:#4db8ff;
  --ok:#7fd18b;
  --warn:#e3b341;
  --err:#f0766b;
  /* space */
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem;
  /* radius */
  --r1:9px; --r2:14px;
  /* type */
  --fs-xs:.72rem; --fs-sm:.82rem; --fs:15px; --fs-lg:1.05rem;
  --fs-h2:1rem; --fs-h1:1.7rem;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:var(--fs)/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
/* Links are the primary affordance and appear in almost every table cell, so
   their colour is set here rather than left to the browser default (which was
   #0000EE unvisited / #551A8B visited — both unreadable on this background).
   There is deliberately no separate visited-link colour: visited-ness is not useful in an app,
   and the author `a` rule above already overrides the browser's visited colour. */
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover);text-decoration:underline}
::placeholder{color:var(--faint)}
::selection{background:var(--acc);color:var(--on-acc)}
:focus-visible{outline:2px solid var(--link);outline-offset:1px}
/* ---- chrome: a warm tool bar. Nav items carry the live counts so the bar
   is an instrument, not just navigation. -------------------------------- */
header{display:flex;align-items:center;gap:1.4rem;padding:.65rem 1.3rem;
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;
  top:0;z-index:5}
header .brand{font-weight:800;letter-spacing:.02em;font-size:1.05rem;color:var(--fg)}
header .brand span{color:var(--acc)}
header nav{display:flex;align-items:center;gap:.25rem}
header nav a{display:flex;align-items:center;gap:.45rem;color:var(--dim);
  padding:.42rem .8rem;border-radius:var(--r1);font-size:.9rem;font-weight:500;
  white-space:nowrap}
header nav a b{font-size:.68rem;font-weight:700;color:var(--dim);
  background:var(--surface-2);border-radius:99px;padding:.05rem .4rem}
header nav a:hover{background:var(--surface-2);color:var(--fg);text-decoration:none}
header nav a.on{background:var(--surface-2);color:var(--fg)}
header nav a.on b{color:var(--on-acc);background:var(--acc)}
header .sp{flex:1}
header .sync{font-size:.78rem;color:var(--faint)}
header .sync b{color:var(--ok)}
header form{margin:0}
main{padding:1.4rem;max-width:1150px;margin:0 auto}
h1{font-size:var(--fs-h1);margin:.1rem 0 .5rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:var(--fs-h2);margin:1.6rem 0 .6rem;color:var(--dim);
  text-transform:uppercase;letter-spacing:.06em}
/* ---- page heading: where you are, and why you're here --------------- */
.crumb{color:var(--faint);font-size:var(--fs-sm);margin:.1rem 0 .35rem}
.crumb a{color:var(--faint)}
.crumb a:hover{color:var(--dim);text-decoration:none}
.lede{color:var(--dim);max-width:62ch;margin:.2rem 0 1.2rem}
/* ---- tables: hairline, no vertical rules ----------------------------- */
table{border-collapse:collapse;width:100%;margin:.4rem 0 1.2rem}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);
  vertical-align:top}
th{color:var(--faint);font-weight:600;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.07em;border-bottom-color:var(--line-strong)}
tbody tr:hover td{background:var(--surface)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* ---- form controls --------------------------------------------------- */
input,select,textarea{background:var(--surface);color:var(--fg);
  border:1px solid var(--line);border-radius:var(--r1);padding:.45rem .6rem;font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--line-strong)}
textarea{width:100%;min-height:4rem}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:var(--r1);
  padding:.5rem .9rem;font:inherit;font-weight:650;cursor:pointer}
button:hover{background:var(--acc-hover)}
button.ghost{background:var(--surface-2);color:var(--fg);font-weight:550}
button.ghost:hover{background:var(--line)}
button.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
button.danger:hover{background:var(--err);color:var(--on-acc)}
button.small{padding:.2rem .55rem;font-size:.78rem}
.btn{display:inline-block;background:var(--surface-2);color:var(--fg);
  border:1px solid var(--line);border-radius:var(--r1);padding:.5rem .9rem;
  font-size:.88rem;font-weight:600}
.btn:hover{border-color:var(--acc);text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover{background:var(--acc-hover)}
form.inline{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0 1.2rem}
.row{display:grid;grid-template-columns:9rem 1fr;gap:.5rem 1rem;align-items:center;margin:.5rem 0}
/* ---- text utilities -------------------------------------------------- */
.sp{flex:1}
.muted{color:var(--dim)}
.small{font-size:var(--fs-sm)}
.warn{color:var(--warn)}
.err{color:var(--err)}
.ok{color:var(--ok)}
.dnp{opacity:.5}
/* ---- chips / tags ---------------------------------------------------- */
.tag{display:inline-block;background:var(--surface-2);border-radius:99px;
  padding:.08rem .55rem;font-size:var(--fs-xs);color:var(--dim);
  letter-spacing:.04em;text-transform:uppercase}
.tag.mode-on{background:var(--acc);color:var(--on-acc);font-weight:700}
.chip{display:inline-block;background:var(--surface-2);color:var(--dim);
  border-radius:99px;padding:.1rem .55rem;font-size:var(--fs-xs);
  letter-spacing:.05em;text-transform:uppercase}
.chip.acc{background:rgba(255,103,0,.16);color:var(--acc)}
/* ---- cards ----------------------------------------------------------- */
.cards{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  padding:.9rem 1.1rem;min-width:9rem}
.card b{display:block;font-size:1.55rem;font-family:ui-monospace,Menlo,monospace}
/* a card with a titled header, used for the contents / editor panels */
.card.panel{padding:0;overflow:hidden;margin-bottom:1rem}
.card .hd2{display:flex;align-items:center;gap:.7rem;padding:.8rem 1.1rem;
  border-bottom:1px solid var(--line)}
.card .hd2 h2{margin:0;font-size:1rem;font-weight:650;text-transform:none;
  letter-spacing:0;color:var(--fg)}
.card .hd2 .n{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-xs);color:var(--faint)}
.card .hd2 .r{margin-left:auto;font-size:var(--fs-sm)}
.card .pad{padding:.8rem 1.1rem 1rem}
.card .pad h3{margin:1.1rem 0 .35rem;font-size:var(--fs-sm);color:var(--dim);
  text-transform:uppercase;letter-spacing:.06em}
.card .pad h3:first-child{margin-top:.2rem}
/* the alternatives inside a variant slot, laid out as pickable cards */
.plist .choices{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.5rem}
.plist .choice{background:var(--bg);border:1px solid var(--line);border-radius:var(--r1);
  padding:.5rem .75rem;min-width:11rem}
.plist .choice.sel{border-color:var(--acc);background:var(--surface-2)}
.plist .choice .cl{font-weight:600;font-size:.92rem}
.plist .choice .ct{font-size:var(--fs-xs);color:var(--dim);
  font-family:ui-monospace,Menlo,monospace}
.plist .q{font-size:1rem}
.plist .q small{font-size:.46rem}
details.card>summary{cursor:pointer;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary .r{visibility:hidden}
/* ---- Part-DB picker on the part form --------------------------------- */
.pdb{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.pdbtop{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.pdbtop #pdbq{flex:1;min-width:16rem}
.hits{background:var(--bg);border:1px solid var(--line);border-radius:var(--r1);
  max-height:18rem;overflow:auto}
.hit{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:.55rem .8rem;color:var(--fg);font:inherit;cursor:pointer}
.hit:last-child{border-bottom:0}
.hit:hover,.hit:focus{background:var(--surface-2)}
.hit .hn{font-weight:600}
.hit .hm{color:var(--faint);font-size:var(--fs-xs);font-family:ui-monospace,Menlo,monospace;align-self:center}
.hit .hd{grid-column:1/-1;color:var(--dim);font-size:var(--fs-sm)}
.hit.none{color:var(--dim);cursor:default}
/* ---- the two verbs: gather / build, stated open ---------------------- */
.verbs{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:0 0 1.5rem}
.verb{display:block;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);padding:1rem 1.15rem}
.verb.primary{background:linear-gradient(135deg,var(--surface-2),var(--surface));
  border-color:var(--line-strong)}
.verb{color:var(--fg)}
.verb .vt{font-size:1.05rem;font-weight:700;margin-bottom:.2rem}
.verb .vd{color:var(--dim);font-size:.88rem}
.verb .go{margin-top:.6rem;font-size:.8rem;color:var(--acc);font-weight:600}
.verb:hover{text-decoration:none;border-color:var(--acc)}
.verb:hover .vt{color:var(--fg)}
/* ---- the parts list: chunky rows, one per part ----------------------- */
ul.plist{list-style:none;margin:0;padding:0}
ul.plist li{display:grid;grid-template-columns:2.6rem 1fr auto;gap:1rem;
  align-items:center;padding:.65rem .3rem;border-bottom:1px solid var(--line)}
ul.plist li:last-child{border-bottom:0}
ul.plist li:hover{background:var(--surface-2)}
ul.plist .q{font-family:ui-monospace,Menlo,monospace;font-size:1.15rem;font-weight:700;
  color:var(--acc);text-align:center;background:var(--bg);border-radius:var(--r1);padding:.3rem 0}
ul.plist .q small{display:block;font-size:.5rem;letter-spacing:.1em;color:var(--faint);
  font-weight:500}
ul.plist .nm{font-weight:600}
ul.plist .sub{font-size:var(--fs-sm);color:var(--dim)}
ul.plist .sub .refs{font-family:ui-monospace,Menlo,monospace;color:var(--faint)}
ul.plist .price{font-size:var(--fs-sm);color:var(--dim);text-align:right;
  font-variant-numeric:tabular-nums}
ul.plist li.dnp{opacity:.5}
ul.plist li.dnp .nm{text-decoration:line-through}
/* ---- variant slots: chooser cards ----------------------------------- */
.slotcard{background:var(--bg);border:1px dashed var(--line-strong);
  border-radius:var(--r2);padding:1rem 1.1rem;margin:.6rem 0}
.slotcard .sh{font-weight:650;margin-bottom:.2rem}
.slotcard .sd{color:var(--dim);font-size:var(--fs-sm);margin-bottom:.7rem}
.slotcard .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.slotcard .choice{display:block;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r1);padding:.6rem .8rem}
.slotcard .choice.sel{border-color:var(--acc);background:var(--surface-2)}
.slotcard .choice .cl{font-weight:600}
.slotcard .choice .ct{font-size:.76rem;color:var(--dim);
  font-family:ui-monospace,Menlo,monospace}
.slotcard .choice .cd{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--acc)}
/* ---- a mode bar states which of the two modes a page is in ---------- */
.modebar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);
  padding:.5rem .7rem;margin:0 0 1.1rem}
.modebar form{margin:0}
/* ---- manual steps ---------------------------------------------------- */
.steps{display:flex;flex-direction:column;gap:.7rem}
.step{display:grid;grid-template-columns:2.6rem 1fr;gap:.9rem;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r2);padding:.9rem 1rem}
.stepnum{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--acc);
  color:var(--on-acc);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1rem}
.steptitle{font-weight:650;font-size:1.02rem;margin-bottom:.2rem}
.steptext{color:var(--dim);white-space:pre-wrap;margin-bottom:.4rem}
.step img{max-width:100%;max-height:22rem;border-radius:var(--r1);display:block;margin:.4rem 0}
.step figure{margin:.5rem 0}
.step .meta{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.55rem 0 0}
/* the bar that says which build the manual is being read as */
.viewing{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);
  padding:.55rem .8rem;margin:0 0 1.2rem}
.viewing label{color:var(--dim);font-size:var(--fs-sm)}
.viewing select{min-width:16rem}
.step form.inline.small{margin:.3rem 0}
.stepbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0 0}
.stepbar form{margin:0}
.submanual{border-left:2px solid var(--acc);padding-left:.8rem;margin:.6rem 0;
  background:var(--bg);border-radius:0 var(--r1) var(--r1) 0}
.step .submanual .step{background:var(--surface)}
/* ---- embedded board / model ----------------------------------------- */
.ibom{width:100%;height:34rem;border:1px solid var(--line);border-radius:var(--r1);
  background:var(--paper);margin:.5rem 0}
model-viewer.model{width:100%;height:30rem;border:1px solid var(--line);
  border-radius:var(--r1);margin:.5rem 0;display:block;background:var(--bg)}
.docbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.4rem 0}
.docbar form{margin:0}
</style>
</head><body>
<header>
<a class="brand" href="/">mise<span>.</span></a>
<nav>
  <a href="/parts"{{if eq .Active "/parts"}} class="on"{{end}}>Parts{{if .PartCount}}<b>{{.PartCount}}</b>{{end}}</a>
  <a href="/assemblies"{{if eq .Active "/assemblies"}} class="on"{{end}}>Assemblies{{if .AsmCount}}<b>{{.AsmCount}}</b>{{end}}</a>
  <a href="/builds"{{if eq .Active "/builds"}} class="on"{{end}}>Builds{{if .BuildCount}}<b>{{.BuildCount}}</b>{{end}}</a>
  <a href="/ibom/import"{{if eq .Active "/ibom"}} class="on"{{end}}>Import iBOM</a>
</nav>
<span class="sp"></span>
<form method="post" action="/partdb/sync"><button class="ghost small">Sync Part-DB</button></form>
</header>
<main>
{{end}}

{{define "foot"}}</main></body></html>{{end}}
